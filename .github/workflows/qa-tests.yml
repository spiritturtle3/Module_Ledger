
name: ModuLedger QA Tests

on:
  push:
  pull_request:

jobs:
  integrity-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run package integrity tests
        run: node --test --test-reporter=spec qa/tests/integrity.test.cjs
