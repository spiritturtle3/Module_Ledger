name: ModuLedger QA Tests

on:
  push:
    branches:
      - main
      - feature/backend-ipfs-api
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests and validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: Backend

    env:
      PINATA_JWT: ci-placeholder-for-validation-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Pin npm version
        run: npm install --global npm@10.9.4

      - name: Verify runtime versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run all backend tests
        run: npm test

      - name: Type-check backend
        run: npm run typecheck

      - name: Type-check tests
        run: npm run typecheck:test

      - name: Build backend
        run: npm run build
